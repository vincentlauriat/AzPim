name: AzPim
options:
  bundleIdPrefix: fr.vincentlauriat
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  # English source; French from the String Catalogs (AzPim/Localizable.xcstrings, core .lproj tables).
  developmentLanguage: en

packages:
  AzPimCore:
    path: Packages/AzPimCore
  MSAL:
    url: https://github.com/AzureAD/microsoft-authentication-library-for-objc
    revision: 7fb550e520e21ab2273639a88889cf432fdb71a7   # tag 2.17.1, pinned by commit (a moved tag cannot change a signed build)
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    revision: ab7d71291238df6e0492143b120c9b696a35f603   # tag 2.10.1

# Explicit scheme (xcodegen does not keep hand-made schemes across regenerations).
schemes:
  AzPim:
    build:
      targets:
        AzPim: all
    run:
      config: Debug
    # Hosted unit tests (Debug only); not in `build`, so archive and Scripts/release.sh never build them.
    test:
      config: Debug
      targets:
        - AzPimTests
      # Hosted tests assert English text: run the host in English whatever the Mac's language (launch arguments,
      # no UserDefaults domain is written).
      commandLineArguments:
        "-AppleLanguages (en)": true
        "-AppleLocale en_US": true
    archive:
      config: Release
  # AzPim 2.0 for iPhone (PLAN.md › Version 2.0).
  AzPimMobile:
    build:
      targets:
        AzPimMobile: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  AzPim:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: AzPim
        excludes:
          - "**/*.entitlements"
          - "Info.plist"
    configFiles:
      Debug: Config/AzPim.xcconfig
      Release: Config/AzPim.xcconfig
    dependencies:
      - package: AzPimCore
      - package: MSAL
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: AzPim
        PRODUCT_BUNDLE_IDENTIFIER: fr.vincentlauriat.azpim
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        # Writes the .stringsdata the String Catalog check reads (Scripts/check-localizations.py).
        SWIFT_EMIT_LOC_STRINGS: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "7"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ARCHS: "$(ARCHS_STANDARD)"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: AzPim/AzPim.entitlements
        # Debug builds are unsigned; Scripts/release.sh signs with Developer ID (Step 6).
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    info:
      path: AzPim/Info.plist
      properties:
        CFBundleName: AzPim
        # English and French; the app follows the system language (no in-app switch).
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr]
        CFBundleDisplayName: AzPim
        CFBundleIdentifier: fr.vincentlauriat.azpim
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        # Menu bar agent: no Dock icon until the main window opens.
        LSUIElement: true
        # MSAL client id (Config/AzPim.xcconfig); empty = Microsoft sign-in disabled.
        AzPimClientID: "$(AZPIM_CLIENT_ID)"
        NSHumanReadableCopyright: "© 2026 Vincent Lauriat. MIT License."
        # Sparkle. Never change SUPublicEDKey: see the banner in Scripts/release.sh.
        SUFeedURL: https://raw.githubusercontent.com/vincentlauriat/AzPim/main/appcast.xml
        SUPublicEDKey: oGxHAH0aXmMuHBG/E6/PsROoQPDhw3vicDP+FK1S4hA=
        SUEnableAutomaticChecks: true
        # Check the EdDSA signature before extracting the archive (security review, medium 3).
        SUVerifyUpdateBeforeExtraction: true
        CFBundleURLTypes:
          - CFBundleURLName: fr.vincentlauriat.azpim
            CFBundleURLSchemes:
              - azpim
              # MSAL redirect URI (TRD): msauth.<bundle id>://auth
              - msauth.fr.vincentlauriat.azpim

  # RoleStore tests hosted in the app (fakes for PIM sources, tokens, sleeps and notifications). AzPimCore is
  # not linked again: the test bundle uses the app's copy (a second copy would duplicate the @Model classes).
  AzPimTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: AzPimTests
    dependencies:
      - target: AzPim
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.vincentlauriat.azpim.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AzPim.app/Contents/MacOS/AzPim"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

  # AzPim for iPhone (2.0, step 2): MSAL with the Microsoft Authenticator broker, no Azure CLI, no Sparkle.
  # Platform-neutral app code (store, services, models glue, Activation Sheet) is compiled from AzPim/ by both
  # targets; macOS-only files are excluded here, macOS-only lines are behind `#if os(macOS)`.
  AzPimMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AzPimMobile
        excludes:
          - "**/*.entitlements"
          - "Info.plist"
      - path: AzPim/Services
        excludes:
          - DeepLinkHandler.swift
          - DockPolicy.swift
          - GlobalHotKey.swift
          - UpdaterController.swift
      - path: AzPim/Intents/RoleStore+Intents.swift
      - path: AzPim/Intents/RoleStore+IntentFavorites.swift
      - path: AzPim/Debug/DemoFixtures.swift
      - path: AzPim/Views/Accessibility.swift
      - path: AzPim/Views/ActivationSheet.swift
      - path: AzPim/Views/AdminConsentSheet.swift
      - path: AzPim/Views/Countdown.swift
      - path: AzPim/Views/DisplayName.swift
      - path: AzPim/Views/DurationPicker.swift
      - path: AzPim/Views/ErrorBanner.swift
      - path: AzPim/Views/FavoriteActivationSheet.swift
      - path: AzPim/Views/PanelModel.swift
      - path: AzPim/Views/ResultStatusLine.swift
      - path: AzPim/Views/RoleRows.swift
      - path: AzPim/Views/Theme.swift
      - path: AzPim/Localizable.xcstrings
    configFiles:
      Debug: Config/AzPim.xcconfig
      Release: Config/AzPim.xcconfig
    dependencies:
      - package: AzPimCore
      - package: MSAL
    settings:
      base:
        PRODUCT_NAME: AzPim
        PRODUCT_BUNDLE_IDENTIFIER: fr.vincentlauriat.azpim.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_EMIT_LOC_STRINGS: YES
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_ENTITLEMENTS: AzPimMobile/AzPimMobile.entitlements
        # Simulator: ad-hoc signed so the keychain group entitlement applies (MSAL cache). Device and App Store
        # builds need the team's App ID and provisioning profile (step 5).
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
    info:
      path: AzPimMobile/Info.plist
      properties:
        CFBundleName: AzPim
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr]
        CFBundleDisplayName: AzPim
        CFBundleIdentifier: fr.vincentlauriat.azpim.ios
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        # Landscape too: an iPhone in landscape (667 pt and up) gets the two-pane layout (2.0 step 3).
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # MSAL client id (Config/AzPim.xcconfig), same app registration as the Mac app.
        AzPimClientID: "$(AZPIM_CLIENT_ID)"
        NSHumanReadableCopyright: "© 2026 Vincent Lauriat. MIT License."
        CFBundleURLTypes:
          - CFBundleURLName: fr.vincentlauriat.azpim.ios
            CFBundleURLSchemes:
              # MSAL redirect URI msauth.<bundle id>://auth (to register in Entra) and broker responses.
              - msauth.fr.vincentlauriat.azpim.ios
        # Microsoft Authenticator / Company Portal broker (MSAL 2.x).
        LSApplicationQueriesSchemes: [msauthv2, msauthv3]
