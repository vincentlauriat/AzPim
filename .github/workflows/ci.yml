name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap checks that need no Mac: the appcast and project.yml must agree, and the
  # release script must at least parse.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Release metadata (appcast vs project.yml, pinned packages)
        run: python3 Scripts/check-release-metadata.py

      - name: release.sh syntax
        run: bash -n Scripts/release.sh

  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # Explicit toolchain: the runner's default Xcode can change under us.
      XCODE_APP: /Applications/Xcode_16.4.app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP/Contents/Developer"

      - name: Show toolchain
        run: |
          ls -d /Applications/Xcode*.app
          xcode-select -p
          xcodebuild -version
          swift --version

      # No Package.resolved is committed (the xcodeproj is generated and the core
      # package has no dependencies): MSAL and Sparkle are pinned by revision in
      # project.yml, so key on that file and the core manifest.
      - name: Cache SwiftPM
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            Packages/AzPimCore/.build
            SourcePackages
          key: spm-${{ runner.os }}-xcode16.4-${{ hashFiles('project.yml', 'Packages/AzPimCore/Package.swift', '**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-xcode16.4-

      - name: Install tools
        run: brew install xcodegen swiftlint

      - name: Lint
        run: swiftlint --strict

      - name: Core tests
        run: swift test --parallel --package-path Packages/AzPimCore

      - name: Generate project
        run: xcodegen generate

      - name: Build app
        run: |
          xcodebuild -project AzPim.xcodeproj -scheme AzPim -configuration Debug \
            -destination 'platform=macOS' -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO build

      # RoleStore tests hosted in the Debug app. The step fails unless tests actually ran: a bundle that does not
      # load into the host reports success with zero tests.
      - name: App tests
        run: |
          rm -rf TestResults.xcresult
          xcodebuild -project AzPim.xcodeproj -scheme AzPim -configuration Debug \
            -destination 'platform=macOS' -clonedSourcePackagesDirPath SourcePackages \
            -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO test
          xcrun xcresulttool get test-results summary --path TestResults.xcresult --format json > test-summary.json
          python3 - <<'PY'
          import json
          summary = json.load(open("test-summary.json"))
          total = summary.get("totalTestCount", 0)
          print(f"Hosted app tests: {total} executed, result {summary.get('result')}, "
                f"{summary.get('passedTests')} passed, {summary.get('failedTests')} failed")
          if total == 0 or summary.get("result") != "Passed":
              raise SystemExit("::error::no hosted app test ran, or a test failed")
          PY

      # Same build as Scripts/release.sh, without signing, notarization or DMG.
      - name: Release dry-run build
        run: |
          xcodebuild -project AzPim.xcodeproj -scheme AzPim -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO build
          APP=build/Build/Products/Release/AzPim.app
          plist() { /usr/libexec/PlistBuddy -c "Print :$1" "$APP/Contents/Info.plist"; }
          echo "Built $(plist CFBundleShortVersionString) ($(plist CFBundleVersion))"
          test "$(plist SUFeedURL)" = "https://raw.githubusercontent.com/vincentlauriat/AzPim/main/appcast.xml"
          test -n "$(plist SUPublicEDKey)"
          ARCHS="$(lipo -archs "$APP/Contents/MacOS/AzPim")"
          echo "Architectures: $ARCHS"
          case "$ARCHS" in
            *x86_64*arm64*|*arm64*x86_64*) ;;
            *) echo "::error::not a universal binary: $ARCHS"; exit 1 ;;
          esac
